#
# Configuration
font_family                 JetBrainsMono Nerd Font
font_size                   12
bold_font                   auto
italic_font                 auto
bold_italic_font            auto
remember_window_size        no
initial_window_width        950
initial_window_height       500
cursor_blink_interval       0.5
cursor_stop_blinking_after  1
scrollback_lines            2000
wheel_scroll_min_lines      1
enable_audio_bell           no
window_padding_width        10
hide_window_decorations     yes
background_opacity          0.7
dynamic_background_opacity  yes
confirm_os_window_close     0
selection_foreground        none
selection_background        none
cursor_trail 1

# --- Copy/Paste/Tabs ohne Ctrl+Shift -------------------------------------
# Auswahl mit der Maus landet direkt in der Zwischenablage
copy_on_select             clipboard
# X11-Konvention fuer Copy/Paste (ein Modifier statt zwei)
map ctrl+insert            copy_to_clipboard
map shift+insert           paste_from_clipboard

# Alle Default-Shortcuts loeschen und ein eigenes Alt-Set definieren.
# NOETIG, weil kitty intern 'kitty_mod+alt+t -> set_tab_title' belegt (Rename-Dialog).
# Mit kitty_mod=alt wird daraus ein blankes 'alt+t' und kollidiert mit
# 'alt+t -> new_tab': kitty fuehrt dann BEIDE aus -> neuer Tab + Namensdialog.
clear_all_shortcuts yes

# Copy / Paste
map alt+c                  copy_to_clipboard
map alt+v                  paste_from_clipboard
map alt+s                  paste_from_selection
map ctrl+insert            copy_to_clipboard
map shift+insert           paste_from_clipboard

# Tabs
map alt+t                  new_tab
map alt+q                  close_tab
map alt+,                  move_tab_backward
map alt+.                  move_tab_forward
map alt+shift+left         move_tab_backward
map alt+shift+right        move_tab_forward

# Fenster
map alt+n                  new_os_window
map alt+w                  close_window
map alt+[                  previous_window
map alt+]                  next_window
map alt+f11                toggle_fullscreen
map alt+f10                toggle_maximized

# Schrift / Config
map alt+=                  change_font_size all +2.0
map alt+-                  change_font_size all -2.0
map alt+0                  change_font_size all 0
map alt+f5                 load_config_file
map alt+f2                 edit_config_file

# Scrollback / Suche
map alt+h                  show_scrollback
map alt+k                  scroll_line_up smooth
map alt+j                  scroll_line_down smooth
map alt+page_up            scroll_page_up
map alt+page_down          scroll_page_down
map alt+home               scroll_home
map alt+end                scroll_end
map alt+/                  search_scrollback
