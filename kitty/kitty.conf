# Configuration
font_family                 JetBrainsMono Nerd Font
font_size                   12
bold_font                   auto
italic_font                 auto
bold_italic_font            auto
remember_window_size        no
initial_window_width        950
initial_window_height       500
cursor_blink_interval       0.5
cursor_stop_blinking_after  1
scrollback_lines            2000
wheel_scroll_min_lines      1
enable_audio_bell           no
window_padding_width        10
hide_window_decorations     yes
background_opacity          0.7
dynamic_background_opacity  yes
confirm_os_window_close     0
selection_foreground        none
selection_background        none
cursor_trail 1

# --- Copy/Paste/Tabs ohne Ctrl+Shift -------------------------------------
# Auswahl mit der Maus landet direkt in der Zwischenablage
copy_on_select             clipboard
# X11-Konvention fuer Copy/Paste (ein Modifier statt zwei)
map ctrl+insert            copy_to_clipboard
map shift+insert           paste_from_clipboard

# Alle Default-Shortcuts auf Alt legen: Alt+C copy, Alt+V paste, Alt+T new tab,
# Alt+Q close tab, Alt+W close window, Alt+1..0 Fenster 1..10.
# Hinweis: kapert Alt+C/T/W/V und Alt+1..0 in der Shell.
kitty_mod alt
